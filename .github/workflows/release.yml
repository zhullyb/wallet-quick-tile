name: Build and publish debug APK

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build debug APK and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set release version
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [[ ! "$version_name" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must be a semantic version such as 0.0.1 or v0.0.1"
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "::error::Minor and patch versions must be between 0 and 999"
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Tag produces an invalid Android versionCode"
            exit 1
          fi

          echo "ORG_GRADLE_PROJECT_BUILD_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_BUILD_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Lint and build debug APK
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Verify and prepare release assets
        id: assets
        run: |
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          safe_tag="${GITHUB_REF_NAME//\//-}"
          asset_name="wallet-quick-tile-${safe_tag}-debug.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          checksum_path="$asset_path.sha256"

          cp "$source_apk" "$asset_path"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$asset_name" > "$asset_name.sha256"
          )

          echo "apk=$asset_path" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.assets.outputs.apk }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$APK_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$APK_PATH" "$CHECKSUM_PATH" \
              --verify-tag \
              --generate-notes \
              --title "Wallet Quick Tile $GITHUB_REF_NAME"
          fi
